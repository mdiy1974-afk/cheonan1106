<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efe9dc">
<title>오늘 누가 쏠까? | 사다리타기</title>
<style>
:root{--bg:#f5f0e7;--paper:#fffcf6;--ink:#292820;--muted:#81796b;--line:#ded6c9;--accent:#a76238;--accent-light:#f3e1d2;--green:#54725c;--shadow:0 12px 36px #3e352115}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #bb855c;outline-offset:3px}.shell{max-width:1100px;margin:auto;padding:34px 20px 64px}.eyebrow{font-weight:800;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}h1{font-size:clamp(33px,5vw,54px);letter-spacing:-.055em;line-height:1.12;margin:12px 0}header p{margin:0;color:var(--muted)}.seal{border:1px solid #c8ad94;border-radius:99px;padding:9px 13px;color:#76583e;font-size:12px;font-weight:800;white-space:nowrap}.layout{display:grid;grid-template-columns:335px minmax(0,1fr);gap:20px;align-items:start}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow)}.settings{padding:25px}.card h2{font-size:17px;letter-spacing:-.03em;margin:0}.section-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;margin:26px 0 12px}.section-label:first-of-type{margin-top:25px}.dim{font-size:12px;color:var(--muted);font-weight:500}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{padding:13px 5px;background:#f7f3ec;border:1px solid var(--line);border-radius:12px;font-weight:800;color:#63594c}.mode.active{background:var(--accent-light);color:#854421;border-color:#b97348}.mode span{display:block;font-size:21px;margin-bottom:3px}.people{display:grid;gap:9px;max-height:340px;overflow:auto;padding:2px}.person{display:flex;align-items:center;gap:7px}.num{width:23px;font-size:12px;font-weight:800;color:#a39788;flex:none}.person input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}.remove{border:1px solid var(--line);background:#fff;width:35px;height:39px;border-radius:10px;color:#978b7c;font-size:19px}.small-btn{width:100%;border:1px dashed #c5b7a5;background:none;border-radius:11px;padding:11px;margin-top:9px;color:#755e49;font-weight:750}.buttons{display:grid;gap:9px;margin-top:25px}.primary{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:15px 12px;font-weight:850}.primary:hover{background:#484235}.secondary{border:1px solid var(--line);background:#fff;color:#575043;border-radius:12px;padding:13px;font-weight:750}.game{padding:24px;min-width:0}.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.status{border-radius:99px;background:#edf0e8;color:var(--green);font-size:11px;font-weight:800;padding:7px 12px}.tip{color:var(--muted);font-size:13px;margin:8px 0 16px}.ladder-scroll{overflow-x:auto;border:1px solid #e7dfd2;border-radius:16px;background:linear-gradient(180deg,#fffdf9,#f8f3eb);padding:10px 8px;overscroll-behavior-x:contain}#ladder{display:block;margin:0 auto;touch-action:pan-x}#ladder .pick{cursor:pointer}#ladder .pick:hover .name-box{stroke:var(--accent);stroke-width:2}#ladder .pick:focus{outline:none}#ladder .pick:focus .name-box{stroke:var(--accent);stroke-width:3}.result{margin-top:16px;padding:19px;border-radius:15px;background:var(--accent-light);border:1px solid #e4c4a6;text-align:center}.result .mini{font-size:12px;color:#886044;font-weight:800}.result .big{font-size:25px;font-weight:900;letter-spacing:-.04em;margin:5px 0}.result p{margin:0;color:#7c543b;font-size:13px}.result.ok{background:#eef1e9;border-color:#d0dccd}.result.ok .mini,.result.ok p{color:#537159}.result.ok .big{color:#385440}.hidden{display:none!important}.game-actions{display:flex;gap:9px;margin-top:17px}.game-actions button{flex:1}.list{display:grid;gap:7px;margin-top:13px}.list-item{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}.list-item b{color:var(--accent)}.foot{font-size:11px;color:var(--muted);text-align:center;margin:24px 0 0}button:disabled{opacity:.4;cursor:not-allowed}@media(max-width:780px){.layout{grid-template-columns:1fr}.settings{padding:20px}.game{padding:18px}.shell{padding:25px 14px 40px}header{margin-bottom:22px}.seal{display:none}.people{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}.person{gap:5px}.person input{padding:10px 8px}.num{width:17px}}@media(max-width:380px){.people{grid-template-columns:1fr}.game-actions{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
<header><div><div class="eyebrow">THE OFFICE LUCKY DRAW · VOL. 01</div><h1>오늘은 누가 쏠까<span style="color:var(--accent)">?</span></h1><p>점심도, 커피도. 운명은 사다리가 정합니다.</p></div><div class="seal">100% RANDOM · NO EXCUSES</div></header>
<div class="layout">
<section class="card settings" aria-label="게임 설정">
<h2>게임 설정 <span style="float:right;font-size:12px;color:var(--muted);font-weight:500">01 / SETUP</span></h2>
<div class="section-label">무엇을 쏠까요?</div>
<div class="modes"><button class="mode active" type="button" data-mode="coffee" aria-pressed="true"><span>☕</span>커피 쏘기</button><button class="mode" type="button" data-mode="lunch" aria-pressed="false"><span>🍱</span>점심 쏘기</button></div>
<div class="section-label"><span>참가자 이름</span><span id="count" class="dim">4명 · 최대 12명</span></div>
<div id="people" class="people"></div>
<button id="add" class="small-btn" type="button">＋ 참가자 추가</button>
<div class="buttons"><button id="shuffle" class="primary" type="button">↝ 새 사다리 만들기</button><button id="reset" class="secondary" type="button">↺ 처음부터 다시</button></div>
</section>
<section class="card game" aria-label="사다리 게임">
<div class="game-top"><h2>운명의 사다리</h2><span class="status" id="status">READY TO PLAY</span></div>
<p class="tip" id="tip">위쪽 이름을 클릭하면 경로를 따라 결과가 공개돼요.</p>
<div class="ladder-scroll" id="ladderScroll"><svg id="ladder" role="group" aria-label="대화형 사다리 게임"></svg></div>
<div id="result" class="result hidden" aria-live="polite"></div>
<div class="game-actions"><button id="all" class="secondary" type="button">전체 결과 보기</button><button id="again" class="secondary" type="button">다시 섞기 ↻</button></div>
<div id="allResults" class="list hidden" aria-live="polite"></div>
<p class="foot">사다리 연결과 당첨 위치는 매번 무작위로 결정됩니다. · 동일한 사다리에서는 결과가 바뀌지 않아요.</p>
</section>
</div>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
let names=['참가자 1','참가자 2','참가자 3','참가자 4'],mode='coffee',bridges=[],outcomes=[],revealed=new Set(),epoch=0,animating=false,shownAll=false;
const task={coffee:'☕ 커피',lunch:'🍱 점심'};
const rand=(max)=>{if(max<=1)return 0;const a=new Uint32Array(1);const limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max};
function capture(){const arr=[...document.querySelectorAll('.person input')];if(arr.length===names.length)names=arr.map((el,i)=>el.value.trim()||`참가자 ${i+1}`)}
function renderPeople(){const box=$('#people');box.replaceChildren();names.forEach((name,i)=>{const wrap=document.createElement('div');wrap.className='person';const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const input=document.createElement('input');input.maxLength=14;input.value=name;input.setAttribute('aria-label',`${i+1}번 참가자 이름`);input.addEventListener('change',()=>{capture();renderLadder()});const remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.title='참가자 삭제';remove.setAttribute('aria-label',`${i+1}번 참가자 삭제`);remove.disabled=names.length<=2;remove.addEventListener('click',()=>{capture();names.splice(i,1);renderPeople();generate()});wrap.append(num,input,remove);box.append(wrap)});$('#count').textContent=`${names.length}명 · 최대 12명`;$('#add').disabled=names.length>=12}
function generate(){epoch++;animating=false;revealed.clear();shownAll=false;$('#result').classList.add('hidden');$('#allResults').classList.add('hidden');$('#all').textContent='전체 결과 보기';$('#status').textContent='READY TO PLAY';$('#tip').textContent='위쪽 이름을 클릭하면 경로를 따라 결과가 공개돼요.';const n=names.length,rows=Math.max(12,n*4);bridges=[];for(let r=0;r<rows;r++){let c=rand(n-1);if(r&&c===bridges[r-1])c=(c+1+rand(Math.max(1,n-2)))%(n-1);bridges.push(c)}const winner=rand(n);outcomes=Array.from({length:n},(_,i)=>i===winner?'당첨':'통과');renderLadder()}
function trace(start){let col=start;const pts=[[col,0]];for(let r=0;r<bridges.length;r++){pts.push([col,r+.5]);if(bridges[r]===col)col++;else if(bridges[r]===col-1)col--;pts.push([col,r+.5])}pts.push([col,bridges.length+1]);return {end:col,pts}}
function svgEl(parent,tag,attrs,text){const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));if(text!==undefined)el.textContent=text;parent.appendChild(el);return el}
function geometry(){const n=names.length,gap=87,left=48,top=70,step=19,bottom=top+(bridges.length+1)*step,width=left*2+(n-1)*gap;return {gap,left,top,step,bottom,width,height:bottom+77,x:c=>left+c*gap,y:r=>top+r*step}}
function drawBase(){const svg=$('#ladder'),g=geometry();svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${g.width} ${g.height}`);svg.setAttribute('width',g.width);svg.setAttribute('height',g.height);for(let i=0;i<names.length;i++)svgEl(svg,'line',{x1:g.x(i),x2:g.x(i),y1:g.top,y2:g.bottom,stroke:'#c5b9aa','stroke-width':3,'stroke-linecap':'round'});bridges.forEach((col,r)=>svgEl(svg,'line',{x1:g.x(col),x2:g.x(col+1),y1:g.y(r+.5),y2:g.y(r+.5),stroke:'#b4a18e','stroke-width':3,'stroke-linecap':'round'}));for(let i=0;i<names.length;i++){const group=svgEl(svg,'g',{class:'pick',tabindex:'0',role:'button','aria-label':`${names[i]} 사다리 출발`});const isSeen=revealed.has(i);svgEl(group,'rect',{class:'name-box',x:g.x(i)-40,y:8,width:80,height:40,rx:10,fill:isSeen?'#f3e1d2':'#ffffff',stroke:isSeen?'#a76238':'#ded6c9'});svgEl(group,'text',{x:g.x(i),y:32,'text-anchor':'middle','font-size':names[i].length>6?11:13,'font-weight':700,fill:'#383126'},names[i].length>7?names[i].slice(0,6)+'…':names[i]);group.addEventListener('click',()=>reveal(i));group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal(i)}});const result=outcomes[i],visible=shownAll||[...revealed].some(s=>trace(s).end===i);svgEl(svg,'rect',{x:g.x(i)-38,y:g.bottom+17,width:76,height:35,rx:9,fill:visible&&result==='당첨'?'#f1d6c2':'#fff',stroke:visible&&result==='당첨'?'#b8784b':'#dfd6ca'});svgEl(svg,'text',{x:g.x(i),y:g.bottom+39,'text-anchor':'middle','font-size':12,'font-weight':800,fill:visible&&result==='당첨'?'#944b29':'#72685c'},visible?result:'?')}return g}
function pathFor(index){const g=geometry(),pts=trace(index).pts;return {d:pts.map((p,i)=>`${i?'L':'M'} ${g.x(p[0])} ${g.y(p[1])}`).join(' '),end:trace(index).end}}
function renderLadder(){const g=drawBase(),svg=$('#ladder');[...revealed].forEach((i,k)=>{const {d}=pathFor(i);const path=svgEl(svg,'path',{d,fill:'none',stroke:outcomes[trace(i).end]==='당첨'?'#af5d32':'#60816b','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round',opacity:k===revealed.size-1?1:.55,'pointer-events':'none'});svg.insertBefore(path,svg.querySelector('.pick'))});}
function winnerName(){return names.find((_,i)=>outcomes[trace(i).end]==='당첨')}
function showResult(i){const dest=trace(i).end,isWinner=outcomes[dest]==='당첨',r=$('#result');r.className='result'+(isWinner?'':' ok');const mini=document.createElement('div');mini.className='mini';mini.textContent=isWinner?'🎉 당첨! 오늘의 주인공':'🍀 무사 통과!';const big=document.createElement('div');big.className='big';big.textContent=names[i];const note=document.createElement('p');note.textContent=isWinner?`${task[mode]} 쏘기 당첨! 지갑을 준비하세요 😎`:'오늘은 얻어먹는 날!';r.replaceChildren(mini,big,note);$('#status').textContent=isWinner?'WINNER FOUND':'RESULT REVEALED';$('#tip').textContent=`${names[i]}님의 사다리 결과가 공개됐어요.`}
function reveal(i){if(animating)return;const myEpoch=epoch;revealed.add(i);shownAll=false;$('#allResults').classList.add('hidden');$('#all').textContent='전체 결과 보기';renderLadder();const svg=$('#ladder'),last=svg.querySelectorAll('path');const path=last[last.length-1];if(!path){showResult(i);return}const length=path.getTotalLength();path.style.strokeDasharray=length;path.style.strokeDashoffset=length;animating=true;$('#status').textContent='DRAWING...';const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced){path.style.strokeDashoffset='0';animating=false;showResult(i);return}const anim=path.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:Math.min(2400,1050+bridges.length*23),easing:'ease-in-out',fill:'forwards'});anim.onfinish=()=>{if(epoch!==myEpoch)return;path.style.strokeDashoffset='0';anim.cancel();animating=false;renderLadder();showResult(i)};anim.oncancel=()=>{if(epoch===myEpoch)animating=false}}
function showAll(){if(animating)return;shownAll=!shownAll;$('#all').textContent=shownAll?'전체 결과 숨기기':'전체 결과 보기';const list=$('#allResults');list.replaceChildren();list.classList.toggle('hidden',!shownAll);if(shownAll){names.forEach((name,i)=>{const row=document.createElement('div');row.className='list-item';const label=document.createElement('span');label.textContent=name;const value=document.createElement('b');const yes=outcomes[trace(i).end]==='당첨';value.textContent=yes?`${task[mode]} 쏘기 🎉`:'통과 ✓';if(!yes)value.style.color='var(--green)';row.append(label,value);list.append(row)});$('#status').textContent='ALL RESULTS';$('#tip').textContent=`오늘의 당첨자는 ${winnerName()}님!`;}else{$('#status').textContent=revealed.size?'RESULT REVEALED':'READY TO PLAY';$('#tip').textContent='위쪽 이름을 클릭하면 경로를 따라 결과가 공개돼요.'}renderLadder()}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{capture();mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});generate()}));$('#add').addEventListener('click',()=>{capture();if(names.length<12){names.push(`참가자 ${names.length+1}`);renderPeople();generate()}});$('#shuffle').addEventListener('click',()=>{capture();renderPeople();generate()});$('#again').addEventListener('click',()=>{capture();renderPeople();generate()});$('#reset').addEventListener('click',()=>{names=['참가자 1','참가자 2','참가자 3','참가자 4'];mode='coffee';document.querySelectorAll('.mode').forEach(b=>{const on=b.dataset.mode===mode;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});renderPeople();generate()});$('#all').addEventListener('click',showAll);renderPeople();generate();
})();
</script>
</body></html>
